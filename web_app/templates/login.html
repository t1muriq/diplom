{% extends "base.html" %}
{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-3">Вход в систему</h4>
                <p class="text-muted text-center small">
                    Авторизация выполняется по ролям PostgreSQL
                </p>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Роль (логин)</label>
                        <select name="username" class="form-select" required>
                            <option value="">— выберите роль —</option>
                            <option value="admin_db">admin_db (Администратор БД)</option>
                            <option value="operator_user">operator_user (Оператор)</option>
                            <option value="auditor_user">auditor_user (Аудитор)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password"
                               class="form-control" required autofocus>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">
                        Войти
                    </button>
                </form>

                <hr>
                <details class="small text-muted">
                    <summary>Учётные данные по умолчанию</summary>
                    <ul class="mt-2 mb-0">
                        <li><code>admin_db</code> / <code>Admin123!</code></li>
                        <li><code>operator_user</code> / <code>Operator123!</code></li>
                        <li><code>auditor_user</code> / <code>Auditor123!</code></li>
                    </ul>
                </details>
            </div>
        </div>
    </div>
</div>
{% endblock %}
